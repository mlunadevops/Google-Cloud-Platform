<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460">
  <defs>
    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 400;
        fill: #8B949E;
      }
      .zone-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        fill: #8B949E;
      }
      .tunnel-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9px;
        font-weight: 600;
        fill: #3FB950;
      }
      .core-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .sec-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .meta-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 400;
        fill: #8B949E;
      }
      .ctrl-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9px;
        font-weight: 600;
        fill: #D29922;
      }
      .footer-item {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 400;
        fill: #8B949E;
      }
      .footer-active {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #58A6FF;
      }
      .phys-line {
        stroke: #484F58;
        stroke-width: 1.5;
        fill: none;
      }
      .ctrl-dash {
        stroke: #D29922;
        stroke-width: 1.5;
        stroke-dasharray: 4,3;
        fill: none;
        animation: dashMove 14s linear infinite;
      }
      .core-node {
        fill: #1C2128;
        stroke: #58A6FF;
        stroke-width: 2;
        animation: pulseCore 12s ease-in-out infinite;
      }
      .sec-node {
        fill: #161B22;
        stroke: #3FB950;
        stroke-width: 1.5;
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -140; }
      }
      @keyframes pulseCore {
        0%, 100% {
          stroke: #58A6FF;
          stroke-width: 2;
        }
        50% {
          stroke: #79C0FF;
          stroke-width: 2.6;
        }
      }
    </style>
  </defs>

  
  <rect x="0" y="0" width="980" height="460" fill="#0B1016" />

  
  <text x="20" y="34" class="title-text">GCP Lab GSP345 — Terraform VPC &amp; Compute Architecture</text>
  <text x="20" y="54" class="subtitle-text">Global VPC Routing · Subnet-01 (10.10.10.0/24) &amp; Subnet-02 (10.10.20.0/24) · GCS Remote State</text>

  
  <rect x="20" y="70" width="320" height="346" rx="8" fill="#161B22" fill-opacity="0.45" stroke="#30363D" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="34" y="88" class="zone-label">VPC SUBNET-01 // 10.10.10.0/24</text>

  
  <rect x="360" y="70" width="260" height="346" rx="8" fill="#161B22" fill-opacity="0.25" stroke="#21262D" stroke-width="1.5" />
  <text x="490" y="88" text-anchor="middle" class="zone-label">GLOBAL VPC ROUTING &amp; ACL</text>

  
  <rect x="640" y="70" width="320" height="346" rx="8" fill="#161B22" fill-opacity="0.45" stroke="#30363D" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="654" y="88" class="zone-label">VPC SUBNET-02 // 10.10.20.0/24 &amp; GCS</text>

  
  <rect x="385" y="100" width="210" height="24" rx="4" fill="#161B22" stroke="#D29922" stroke-width="1.5" />
  <text x="490" y="115" text-anchor="middle" class="ctrl-text">FIREWALL tf-firewall · TCP/80</text>

  <rect x="385" y="380" width="210" height="24" rx="4" fill="#161B22" stroke="#9E6A03" stroke-width="1.5" />
  <text x="490" y="395" text-anchor="middle" class="ctrl-text">BACKEND GCS · terraform/state</text>

  
  <rect x="376" y="142" width="228" height="92" rx="6" fill="rgba(63, 185, 80, 0.12)" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="490" y="156" text-anchor="middle" class="tunnel-label">EAST-WEST SUBNET TRANSIT</text>

  <rect x="376" y="256" width="228" height="92" rx="6" fill="rgba(63, 185, 80, 0.12)" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="490" y="270" text-anchor="middle" class="tunnel-label">TFSTATE LOCK &amp; SYNC PATH</text>

  
  <polyline points="180,176 180,204 105,204 105,222" class="phys-line" />
  <polyline points="180,176 180,204 255,204 255,222" class="phys-line" />
  <polyline points="270,146 376,146 376,188 396,188" class="phys-line" />
  <polyline points="180,282 180,315 396,315" class="phys-line" />

  <polyline points="800,176 800,204 725,204 725,222" class="phys-line" />
  <polyline points="800,176 800,204 875,204 875,222" class="phys-line" />
  <polyline points="710,146 604,146 604,188 584,188" class="phys-line" />
  <polyline points="800,282 800,315 584,315" class="phys-line" />

  
  <line x1="270" y1="126" x2="385" y2="112" class="ctrl-dash" />
  <line x1="710" y1="126" x2="595" y2="112" class="ctrl-dash" />
  <line x1="490" y1="330" x2="490" y2="380" class="ctrl-dash" />
  <polyline points="584,308 875,308 875,270" class="ctrl-dash" />

  
  <rect x="90" y="116" width="180" height="60" rx="6" class="core-node" />
  <text x="180" y="140" text-anchor="middle" class="core-title">tf-instance-1</text>
  <text x="180" y="158" text-anchor="middle" class="meta-text">e2-standard-2 · debian-12</text>

  <rect x="710" y="116" width="180" height="60" rx="6" class="core-node" />
  <text x="800" y="140" text-anchor="middle" class="core-title">tf-instance-2</text>
  <text x="800" y="158" text-anchor="middle" class="meta-text">e2-standard-2 · debian-12</text>

  
  <rect x="40" y="222" width="130" height="48" rx="6" class="sec-node" />
  <text x="105" y="242" text-anchor="middle" class="sec-title">nic0 · subnet-01</text>
  <text x="105" y="258" text-anchor="middle" class="meta-text">10.10.10.0/24</text>

  <rect x="190" y="222" width="130" height="48" rx="6" class="sec-node" />
  <text x="255" y="242" text-anchor="middle" class="sec-title">ingress · tcp/80</text>
  <text x="255" y="258" text-anchor="middle" class="meta-text">0.0.0.0/0 allowed</text>

  <rect x="396" y="168" width="188" height="44" rx="6" class="sec-node" />
  <text x="490" y="187" text-anchor="middle" class="sec-title">vpc-module v10.0.0</text>
  <text x="490" y="202" text-anchor="middle" class="meta-text">routing_mode: GLOBAL</text>

  <rect x="396" y="286" width="188" height="44" rx="6" class="sec-node" />
  <text x="490" y="305" text-anchor="middle" class="sec-title">gcs-remote-backend</text>
  <text x="490" y="320" text-anchor="middle" class="meta-text">prefix: terraform/state</text>

  <rect x="660" y="222" width="130" height="48" rx="6" class="sec-node" />
  <text x="725" y="242" text-anchor="middle" class="sec-title">nic0 · subnet-02</text>
  <text x="725" y="258" text-anchor="middle" class="meta-text">10.10.20.0/24</text>

  <rect x="810" y="222" width="130" height="48" rx="6" class="sec-node" />
  <text x="875" y="242" text-anchor="middle" class="sec-title">storage-bucket</text>
  <text x="875" y="258" text-anchor="middle" class="meta-text">US · uniform ACL</text>

  
  <circle r="4" fill="#3FB950">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 270,146 L 376,146 L 376,188 L 584,188 L 604,188 L 604,146 L 710,146" />
  </circle>

  <circle r="4" fill="#D29922">
    <animateMotion dur="16s" repeatCount="indefinite" path="M 584,308 L 875,308 L 875,270" />
  </circle>

  
  <text x="120" y="440" text-anchor="middle" class="footer-item">1. Import VMs</text>
  <text x="365" y="440" text-anchor="middle" class="footer-item">2. GCS Backend</text>
  <text x="615" y="440" text-anchor="middle" class="footer-item">3. Scale &amp; Prune</text>
  <text x="860" y="440" text-anchor="middle" class="footer-active">4. VPC &amp; Firewall Active</text>
</svg>
