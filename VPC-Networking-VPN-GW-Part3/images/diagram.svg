
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #f8f9fa; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gcp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe" />
      <stop offset="100%" stop-color="#d2e3fc" />
    </linearGradient>
    <linearGradient id="onprem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce8e6" />
      <stop offset="100%" stop-color="#fad2cf" />
    </linearGradient>
    <linearGradient id="tunnel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34a853" />
      <stop offset="100%" stop-color="#1e8e3e" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
    
    <!-- Arrowheads -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5f6368" />
    </marker>
  </defs>

  <!-- Background Panels -->
  <rect x="20" y="20" width="460" height="610" rx="15" fill="url(#gcp-bg)" stroke="#1a73e8" stroke-width="3" />
  <text x="250" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a73e8">Google Cloud (VPC-demo)</text>

  <rect x="520" y="20" width="460" height="610" rx="15" fill="url(#onprem-bg)" stroke="#d93025" stroke-width="3" />
  <text x="750" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#d93025">On-Premises (Simulado)</text>

  <!-- THE TUNNEL (The Encrypted Tube) -->
  <rect x="450" y="280" width="100" height="80" rx="10" fill="url(#tunnel-bg)" stroke="#188038" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">TÚNEL</text>
  <text x="500" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">IPSEC</text>
  <text x="500" y="355" text-anchor="middle" font-size="11" fill="#e6f4ea">vpc-demo-tunnel0</text>
  
  <!-- Dotted lines representing the encrypted path -->
  <line x1="360" y1="320" x2="450" y2="320" stroke="#34a853" stroke-width="4" stroke-dasharray="8,4" />
  <line x1="550" y1="320" x2="640" y2="320" stroke="#34a853" stroke-width="4" stroke-dasharray="8,4" />

  <!-- ================= GCP SIDE ================= -->
  
  <!-- Cloud Router -->
  <rect x="50" y="180" width="310" height="280" rx="12" fill="#fff" stroke="#1a73e8" stroke-width="2" filter="url(#shadow)" />
  <text x="205" y="210" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">Cloud Router</text>
  <text x="205" y="230" text-anchor="middle" font-size="13" fill="#5f6368">vpc-demo-router1 (ASN: 65001)</text>

  <!-- Step 1: Interface -->
  <rect x="70" y="260" width="270" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2" />
  <text x="85" y="285" font-size="14" font-weight="bold" fill="#1a73e8">1. add-interface</text>
  <text x="85" y="305" font-size="12" fill="#3c4043">if-tunnel0-to-on-prem</text>
  <text x="85" y="325" font-size="12" fill="#3c4043">IP Local: 169.254.0.1</text>

  <!-- Step 2: BGP Peer -->
  <rect x="70" y="360" width="270" height="80" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="2" />
  <text x="85" y="385" font-size="14" font-weight="bold" fill="#d93025">2. add-bgp-peer</text>
  <text x="85" y="405" font-size="12" fill="#3c4043">Peer IP: 169.254.0.2</text>
  <text x="85" y="425" font-size="12" fill="#3c4043">Peer ASN: 65002</text>

  <!-- Connection Arrow from Interface to Tunnel -->
  <line x1="340" y1="300" x2="450" y2="300" stroke="#5f6368" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="395" y="290" text-anchor="middle" font-size="11" fill="#5f6368">se asoma al túnel</text>

  <!-- Connection Arrow from BGP Peer to Interface -->
  <line x1="205" y1="360" x2="205" y2="340" stroke="#d93025" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="215" y="355" font-size="11" fill="#d93025" font-weight="bold">Usa la interfaz</text>


  <!-- ================= ON-PREM SIDE ================= -->
  
  <!-- On-Prem Router -->
  <rect x="640" y="180" width="310" height="280" rx="12" fill="#fff" stroke="#d93025" stroke-width="2" filter="url(#shadow)" />
  <text x="795" y="210" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">On-Prem Router</text>
  <text x="795" y="230" text-anchor="middle" font-size="13" fill="#5f6368">on-prem-router1 (ASN: 65002)</text>

  <!-- Step 1: Interface -->
  <rect x="660" y="260" width="270" height="80" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="2" />
  <text x="675" y="285" font-size="14" font-weight="bold" fill="#d93025">1. add-interface</text>
  <text x="675" y="305" font-size="12" fill="#3c4043">if-tunnel0-to-vpc-demo</text>
  <text x="675" y="325" font-size="12" fill="#3c4043">IP Local: 169.254.0.2</text>

  <!-- Step 2: BGP Peer -->
  <rect x="660" y="360" width="270" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2" />
  <text x="675" y="385" font-size="14" font-weight="bold" fill="#1a73e8">2. add-bgp-peer</text>
  <text x="675" y="405" font-size="12" fill="#3c4043">Peer IP: 169.254.0.1</text>
  <text x="675" y="425" font-size="12" fill="#3c4043">Peer ASN: 65001</text>

  <!-- Connection Arrow from Interface to Tunnel -->
  <line x1="660" y1="300" x2="550" y2="300" stroke="#5f6368" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="605" y="290" text-anchor="middle" font-size="11" fill="#5f6368">se asoma al túnel</text>

  <!-- Connection Arrow from BGP Peer to Interface -->
  <line x1="795" y1="360" x2="795" y2="340" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="805" y="355" font-size="11" fill="#1a73e8" font-weight="bold">Usa la interfaz</text>

  <!-- BGP Session (Dotted bidirectional arrow across the middle) -->
  <path d="M 340 400 Q 500 480 660 400" fill="none" stroke="#ea8600" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead)" />
  <rect x="420" y="440" width="160" height="30" rx="15" fill="#fef7e0" stroke="#ea8600" stroke-width="2" />
  <text x="500" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#ea8600">Sesión BGP</text>
  <text x="500" y="495" text-anchor="middle" font-size="11" fill="#5f6368">(Intercambio de rutas)</text>

  <!-- Bottom Explanatory Legend -->
  <rect x="120" y="530" width="760" height="80" rx="10" fill="#fff" stroke="#dadce0" stroke-width="2" filter="url(#shadow)" />
  <text x="500" y="555" text-anchor="middle" font-size="16" font-weight="bold" fill="#202124">¿Dónde se unen las piezas?</text>
  <text x="500" y="580" text-anchor="middle" font-size="13" fill="#3c4043">
    El comando <tspan font-weight="bold" fill="#d93025">add-bgp-peer</tspan> usa el flag <tspan font-family="monospace" background-color="#f1f3f4">--interface if-tunnel0-to-on-prem</tspan> para decirle al protocolo BGP:
  </text>
  <text x="500" y="600" text-anchor="middle" font-size="13" fill="#3c4043">
    "Sal a hablar con el vecino (169.254.0.2) por la puerta que acabas de crear en el paso 1".
  </text>

</svg>
