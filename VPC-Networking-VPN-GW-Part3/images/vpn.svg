<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .zone-cloud { fill: #161b22; stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 8px; }
      .zone-wan { fill: #12161c; stroke: #21262d; stroke-width: 1; rx: 8px; }
      .zone-onprem { fill: #161b22; stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 8px; }

      .node-box { fill: #1f242d; stroke: #58a6ff; stroke-width: 1.8; rx: 8px; }
      .node-router { fill: #1f242d; stroke: #79c0ff; stroke-width: 1.8; rx: 8px; }
      .node-vpn { fill: #1f242d; stroke: #3fb950; stroke-width: 1.8; rx: 8px; }
      .node-onprem { fill: #1f242d; stroke: #d2a8ff; stroke-width: 1.8; rx: 8px; }

      .title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
      .zone-label { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; }
      .node-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; text-anchor: middle; }
      .node-ip { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; text-anchor: middle; }
      .bgp-badge { fill: #d29922; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 700; text-anchor: middle; }

      .link-line { stroke: #30363d; stroke-width: 3; }
      .tunnel-pipe { fill: rgba(63, 185, 80, 0.08); stroke: #3fb950; stroke-width: 1.5; stroke-dasharray: 5 3; rx: 14px; }
      .tunnel-label { fill: #3fb950; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; text-anchor: middle; }
      .bgp-link { stroke: #d29922; stroke-width: 1.3; stroke-dasharray: 3 3; }

      /* Recorrido del paquete (ciclo de 9s) */
      @keyframes packetJourney {
        0%   { transform: translate(85px, 178px); opacity: 0; }
        6%   { transform: translate(85px, 178px); opacity: 1; }
        22%  { transform: translate(240px, 178px); opacity: 1; } /* vpc-demo-router1 */
        38%  { transform: translate(400px, 178px); opacity: 1; } /* vpc-demo-tunnel0 */
        62%  { transform: translate(580px, 178px); opacity: 1; } /* on-prem-tunnel0 */
        78%  { transform: translate(735px, 178px); opacity: 1; } /* on-prem-router1 */
        88%  { transform: translate(885px, 178px); opacity: 1; } /* On-Prem Host */
        95%  { transform: translate(885px, 178px); opacity: 1; }
        100% { transform: translate(885px, 178px); opacity: 0; }
      }

      /* Estado plano vs cifrado IPsec */
      @keyframes plainState {
        0%, 36%   { opacity: 1; }
        38%, 62%  { opacity: 0; }
        64%, 100% { opacity: 1; }
      }

      @keyframes encryptedState {
        0%, 36%   { opacity: 0; }
        38%, 62%  { opacity: 1; }
        64%, 100% { opacity: 0; }
      }

      /* Pulso del intercambio BGP (169.254.0.1 &lt;-&gt; 169.254.0.2) */
      @keyframes bgpPulse {
        0%, 15%  { opacity: 0.35; }
        22%, 38% { opacity: 1; }
        45%, 100%{ opacity: 0.35; }
      }

      /* Resaltado de pasos inferiores */
      @keyframes step1 { 0%, 22% { fill: #58a6ff; font-weight: 700; } 23%, 100% { fill: #6e7681; font-weight: 400; } }
      @keyframes step2 { 0%, 22% { fill: #6e7681; } 23%, 38% { fill: #d29922; font-weight: 700; } 39%, 100% { fill: #6e7681; } }
      @keyframes step3 { 0%, 38% { fill: #6e7681; } 39%, 62% { fill: #3fb950; font-weight: 700; } 63%, 100% { fill: #6e7681; } }
      @keyframes step4 { 0%, 62% { fill: #6e7681; } 63%, 100% { fill: #d2a8ff; font-weight: 700; } }

      .packet-mover { animation: packetJourney 9s ease-in-out infinite; }
      .pkt-plain { animation: plainState 9s linear infinite; }
      .pkt-enc { animation: encryptedState 9s linear infinite; }
      .bgp-active { animation: bgpPulse 9s ease-in-out infinite; }

      .s1 { animation: step1 9s infinite; }
      .s2 { animation: step2 9s infinite; }
      .s3 { animation: step3 9s infinite; }
      .s4 { animation: step4 9s infinite; }
    </style>
  </defs>

  
  <rect class="bg" x="0" y="0" width="980" height="350" />

  
  <text class="title" x="28" y="34">GCP HA VPN &amp; Dynamic BGP Routing (GSP619)</text>
  <text class="subtitle" x="28" y="54">Peering 169.254.0.1 (ASN 65001) ↔ 169.254.0.2 (ASN 65002) across us-west1</text>

  
  <rect class="zone-cloud" x="20" y="74" width="435" height="215" />
  <text class="zone-label" x="34" y="94">CLOUD VPC (us-west1)</text>

  <rect class="zone-wan" x="463" y="74" width="54" height="215" />
  <text class="zone-label" x="490" y="94" text-anchor="middle">WAN</text>

  <rect class="zone-onprem" x="525" y="74" width="435" height="215" />
  <text class="zone-label" x="539" y="94">ON-PREMISE SIMULATED VPC (us-west1)</text>

  
  <line class="link-line" x1="135" y1="178" x2="185" y2="178" />
  <line class="link-line" x1="295" y1="178" x2="345" y2="178" />
  <line class="link-line" x1="635" y1="178" x2="680" y2="178" />
  <line class="link-line" x1="790" y1="178" x2="835" y2="178" />

  
  <rect class="tunnel-pipe" x="445" y="160" width="90" height="36" />
  <text class="tunnel-label" x="490" y="151">IPsec Tunnel</text>

  
  <g class="bgp-active">
    <path class="bgp-link" d="M 240 144 L 240 112 L 735 112 L 735 144" fill="none" />
    <rect x="385" y="101" width="210" height="20" rx="4" fill="#161b22" stroke="#d29922" stroke-width="1" />
    <text class="bgp-badge" x="490" y="114">BGP 169.254.0.1 ↔ 169.254.0.2</text>
  </g>

  
  <g transform="translate(32, 144)">
    <rect class="node-box" width="103" height="68" />
    <text class="node-title" x="51.5" y="28">Cloud VM</text>
    <text class="node-ip" x="51.5" y="46">VPC Subnet</text>
  </g>

  
  <g transform="translate(185, 144)">
    <rect class="node-router" width="110" height="68" />
    <text class="node-title" x="55" y="24">vpc-demo-router1</text>
    <text class="node-ip" x="55" y="40">ASN 65001</text>
    <text class="node-ip" x="55" y="54">169.254.0.1/30</text>
  </g>

  
  <g transform="translate(345, 144)">
    <rect class="node-vpn" width="100" height="68" />
    <text class="node-title" x="50" y="26">vpc-demo-</text>
    <text class="node-title" x="50" y="40">tunnel0</text>
    <text class="node-ip" x="50" y="56">if-tunnel0-to-on-prem</text>
  </g>

  
  <g transform="translate(535, 144)">
    <rect class="node-vpn" width="100" height="68" />
    <text class="node-title" x="50" y="26">on-prem-</text>
    <text class="node-title" x="50" y="40">tunnel0</text>
    <text class="node-ip" x="50" y="56">if-tunnel0-to-vpc-demo</text>
  </g>

  
  <g transform="translate(680, 144)">
    <rect class="node-router" width="110" height="68" />
    <text class="node-title" x="55" y="24">on-prem-router1</text>
    <text class="node-ip" x="55" y="40">ASN 65002</text>
    <text class="node-ip" x="55" y="54">169.254.0.2/30</text>
  </g>

  
  <g transform="translate(835, 144)">
    <rect class="node-onprem" width="112" height="68" />
    <text class="node-title" x="56" y="28">On-Prem Host</text>
    <text class="node-ip" x="56" y="46">Local Subnet</text>
  </g>

  
  <g class="packet-mover">
    <g class="pkt-plain">
      <rect x="-40" y="-13" width="80" height="26" rx="6" fill="#1f6feb" stroke="#79c0ff" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">IP PACKET</text>
    </g>
    <g class="pkt-enc">
      <rect x="-48" y="-13" width="96" height="26" rx="6" fill="#238636" stroke="#7ee787" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">🔒 ESP TUNNEL</text>
    </g>
  </g>

  
  <g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-size="11">
    <text class="s1" x="28" y="318">1. Cloud VM Egress</text>
    <text class="s2" x="200" y="318">2. BGP Route (ASN 65001 → 65002)</text>
    <text class="s3" x="455" y="318">3. IPsec Transit (169.254.0.1 ↔ .2)</text>
    <text class="s4" x="720" y="318">4. on-prem-router1 → Host</text>
  </g>
</svg>
